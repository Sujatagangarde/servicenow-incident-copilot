# Postgres 16 with the pgvector extension, for storing embeddings.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept in the pgdata volume)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilot-db
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
